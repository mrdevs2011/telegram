{% load static %}
<!DOCTYPE html>
<html lang="uz">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Telegram — {{ chat_user|default:"Chat" }}</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				background-color: #0f141c;
				font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
				height: 100vh;
				height: 100dvh;
				display: flex;
				justify-content: center;
				overflow: hidden;
				color: #111417;
			}

			.chat-window {
				width: 100%;
				max-width: 900px;
				height: 100vh;
				height: 100dvh;
				display: flex;
				flex-direction: column;
				background-color: #6a9775;
				background-image: url('{% static "images/chat-bg.jpg" %}');
				background-size: cover;
				background-position: center;
				background-repeat: no-repeat;
				position: relative;
				box-shadow: 0 0 30px rgba(0, 0, 0, 0.25);
			}

			/* Telegram Top Header */
			.chat-header {
				height: 60px;
				background-color: #ffffff;
				border-bottom: 1px solid #e7e8ec;
				display: flex;
				align-items: center;
				padding: 0 16px;
				z-index: 20;
				flex-shrink: 0;
				box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
			}

			.chat-header-left {
				display: flex;
				align-items: center;
				gap: 12px;
				text-decoration: none;
				color: inherit;
				min-width: 0;
			}

			.back-btn {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 38px;
				height: 38px;
				border-radius: 50%;
				color: #707579;
				text-decoration: none;
				transition: background-color 0.2s, color 0.2s;
				flex-shrink: 0;
			}
			.back-btn:hover {
				background-color: #f1f2f5;
				color: #111417;
			}
			.back-btn svg {
				width: 22px;
				height: 22px;
				fill: currentColor;
			}


			.chat-user-details {
				min-width: 0;
			}
			.chat-user-details h2 {
				font-size: 16px;
				font-weight: 600;
				color: #111417;
				margin: 0;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			/* Messages Scroll Area */
			.messages-container {
				flex: 1;
				overflow-y: auto;
				padding: 16px 20px 84px 20px;
				display: flex;
				flex-direction: column;
				gap: 8px;
				scroll-behavior: smooth;
			}

			/* Speech Bubbles */
			.msg-wrapper {
				display: flex;
				width: 100%;
				animation: fadeIn 0.15s ease;
			}
			@keyframes fadeIn {
				from { opacity: 0; transform: translateY(4px); }
				to { opacity: 1; transform: translateY(0); }
			}

			.msg-wrapper.received {
				justify-content: flex-start;
			}
			.msg-wrapper.sent {
				justify-content: flex-end;
			}

			.msg-bubble {
				max-width: 68%;
				min-width: 70px;
				padding: 7px 12px 6px 12px;
				font-size: 14.5px;
				line-height: 1.42;
				display: flex;
				flex-direction: column;
				box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
				position: relative;
			}

			.msg-text {
				word-break: break-word;
				padding-right: 4px;
				margin-bottom: 2px;
			}

			/* Received (Left, White) */
			.msg-wrapper.received .msg-bubble {
				background-color: #ffffff;
				color: #111417;
				border-radius: 14px 14px 14px 4px;
			}

			/* Sent (Right, Telegram Light Green) */
			.msg-wrapper.sent .msg-bubble {
				background-color: #effdde;
				color: #111417;
				border-radius: 14px 14px 4px 14px;
			}

			.msg-meta {
				display: flex;
				align-items: center;
				justify-content: flex-end;
				align-self: flex-end;
				user-select: none;
				margin-top: -2px;
			}

			.msg-time {
				font-size: 11px;
				color: #828c94;
				line-height: 1;
			}

			/* Telegram Frosted Empty Chat Badge */
			.empty-badge {
				align-self: center;
				margin: auto auto;
				background: rgba(0, 0, 0, 0.42);
				color: #ffffff;
				font-size: 13.5px;
				font-weight: 500;
				padding: 8px 18px;
				border-radius: 18px;
				backdrop-filter: blur(8px);
				-webkit-backdrop-filter: blur(8px);
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
				user-select: none;
				text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
				letter-spacing: 0.1px;
			}

			/* Bottom Floating Input Bar */
			.input-wrapper {
				position: absolute;
				bottom: 14px;
				left: 50%;
				transform: translateX(-50%);
				width: 100%;
				max-width: 720px;
				padding: 0 16px;
				z-index: 30;
			}

			.chat-input-bar {
				background-color: #ffffff;
				border-radius: 24px;
				padding: 6px 8px 6px 18px;
				display: flex;
				align-items: center;
				gap: 10px;
				box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
			}

			.input-field {
				flex: 1;
				background-color: transparent;
				border: none;
				outline: none;
				padding: 10px 4px;
				font-size: 15px;
				color: #111417;
			}
			.input-field::placeholder {
				color: #999ea3;
			}

			.send-btn {
				width: 42px;
				height: 42px;
				border-radius: 50%;
				background-color: #3390ec;
				border: none;
				color: #ffffff;
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				flex-shrink: 0;
				transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
				box-shadow: 0 2px 8px rgba(51, 144, 236, 0.45);
			}
			.send-btn:hover {
				background-color: #2b82db;
				box-shadow: 0 4px 12px rgba(51, 144, 236, 0.55);
			}
			.send-btn:active {
				transform: scale(0.94);
			}
			.send-btn svg {
				width: 20px;
				height: 20px;
				fill: currentColor;
				margin-left: 2px;
			}
		</style>
	</head>
	<body>
		<div class="chat-window">
			<div class="chat-header">
				<div class="chat-header-left">
					<a href="{% url 'contact' %}" class="back-btn" title="Kontaktlar ro'yxatiga qaytish">
						<svg viewBox="0 0 24 24">
							<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
						</svg>
					</a>
					<div class="chat-user-details">
						<h2>{{ chat_user|default:"Chat" }}</h2>
					</div>
				</div>
			</div>

			<!-- Messages Area -->
			<div class="messages-container" data-mr-realtime="1500">
				{% for msg in messages %}
					<div class="msg-wrapper {% if msg.sender == request.user %}sent{% else %}received{% endif %}">
						<div class="msg-bubble">
							<span class="msg-text">{{ msg.text }}</span>
							<div class="msg-meta">
								<span class="msg-time">{{ msg.timestamp|time:"H:i" }}</span>
							</div>
						</div>
					</div>
				{% empty %}
					<div class="empty-badge">
						Hali xabarlar yo'q. Birinchi xabarni yozing! 👋
					</div>
				{% endfor %}
				<!-- HTML Langar (Pastga tushirish uchun) -->
				<div id="bottom"></div>
			</div>

			<!-- Bottom Capsule Input Form -->
			<div class="input-wrapper">
				<form method="POST" class="chat-input-bar">
					{% csrf_token %}
					<input type="text" name="text" class="input-field" placeholder="Xabarni yozing..." required autocomplete="off" autofocus>

					<!-- Send Button with SVG plane -->
					<button type="submit" class="send-btn" title="Yuborish">
						<svg viewBox="0 0 24 24">
							<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
						</svg>
					</button>
				</form>
			</div>
		</div>
	</body>
</html>
