<!DOCTYPE html>
<html lang="uz">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Telegram — Kirish</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				min-height: 100vh;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				background-color: #f1f2f5;
				font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
				padding: 20px;
				color: #111417;
			}

			.auth-card {
				width: 100%;
				max-width: 400px;
				background-color: #ffffff;
				border-radius: 16px;
				padding: 40px 32px;
				box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
				display: flex;
				flex-direction: column;
				align-items: center;
			}

			.logo-container {
				margin-bottom: 20px;
				display: flex;
				justify-content: center;
				transition: transform 0.3s ease;
			}
			.logo-container:hover {
				transform: scale(1.05);
			}

			.tg-logo {
				width: 100px;
				height: 100px;
				filter: drop-shadow(0 8px 18px rgba(34, 158, 217, 0.3));
			}

			.welcome {
				text-align: center;
				margin-bottom: 28px;
			}
			.welcome h1 {
				color: #111417;
				font-size: 24px;
				font-weight: 600;
				margin-bottom: 6px;
				letter-spacing: -0.3px;
			}
			.welcome p {
				color: #707579;
				font-size: 14px;
				line-height: 1.4;
			}

			form {
				width: 100%;
				display: flex;
				flex-direction: column;
				gap: 16px;
			}

			.input-group {
				display: flex;
				flex-direction: column;
				position: relative;
			}

			.input-group label {
				font-size: 13px;
				font-weight: 500;
				color: #707579;
				margin-bottom: 6px;
			}

			input {
				width: 100%;
				padding: 12px 14px;
				font-size: 15px;
				border: 1.5px solid #dfe1e5;
				border-radius: 10px;
				outline: none;
				background: #fdfdfd;
				color: #111417;
				transition: border-color 0.2s, box-shadow 0.2s;
			}
			input::placeholder {
				color: #a4a9ae;
			}
			input:focus {
				border-color: #3390ec;
				background: #ffffff;
				box-shadow: 0 0 0 3px rgba(51, 144, 236, 0.15);
			}

			button {
				background-color: #3390ec;
				color: #ffffff;
				border: none;
				padding: 13px;
				font-size: 15px;
				font-weight: 600;
				border-radius: 10px;
				cursor: pointer;
				transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
				box-shadow: 0 4px 12px rgba(51, 144, 236, 0.3);
				text-transform: uppercase;
				letter-spacing: 0.5px;
				margin-top: 6px;
			}
			button:hover {
				background-color: #2b82db;
				box-shadow: 0 6px 16px rgba(51, 144, 236, 0.4);
			}
			button:active {
				transform: scale(0.98);
			}

			.footer-text {
				margin-top: 10px;
				font-size: 14px;
				color: #707579;
				text-align: center;
			}
			.footer-text a {
				color: #3390ec;
				text-decoration: none;
				font-weight: 600;
				margin-left: 4px;
				transition: color 0.2s;
			}
			.footer-text a:hover {
				text-decoration: underline;
			}

			.error-box {
				background-color: rgba(223, 63, 64, 0.08);
				border: 1px solid rgba(223, 63, 64, 0.25);
				color: #df3f40;
				padding: 10px 14px;
				font-size: 13.5px;
				font-weight: 500;
				border-radius: 8px;
				text-align: center;
				line-height: 1.4;
				animation: shake 0.3s ease;
			}

			@keyframes shake {
				0%, 100% { transform: translateX(0); }
				25% { transform: translateX(-5px); }
				75% { transform: translateX(5px); }
			}
		</style>
	</head>
	<body>
		<div class="auth-card">
			<div class="logo-container">
				<svg class="tg-logo" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
					<defs>
						<linearGradient id="tgGrad" x1="120" y1="0" x2="120" y2="240" gradientUnits="userSpaceOnUse">
							<stop stop-color="#2AABEE"/>
							<stop offset="1" stop-color="#229ED9"/>
						</linearGradient>
					</defs>
					<circle cx="120" cy="120" r="120" fill="url(#tgGrad)"/>
					<path fill="white" d="M52 119.5L172 69C177.5 66.5 182.5 70.5 180.5 76L160 172.5C158.5 179 154.5 180.5 149 177.5L118 154.5L103 169C101.5 170.5 100 172 97 172L99.2 140.5L156.5 89C159 86.8 156 85.5 152.7 87.7L81.7 132.5L51.2 123C44.5 121 44.5 116.5 52 119.5Z"/>
				</svg>
			</div>

			<div class="welcome">
				<h1>Telegram</h1>
				<p>Davom etish uchun hisobingizga kiring</p>
			</div>

			<form method="POST">
				{% csrf_token %}
				<div class="input-group">
					<label for="username">Foydalanuvchi nomi</label>
					<input id="username" type="text" placeholder="Foydalanuvchi nomini kiriting" name="username" required autocomplete="off" autofocus>
				</div>
				<div class="input-group">
					<label for="password">Parol</label>
					<input id="password" type="password" placeholder="Parolingizni kiriting" name="password" required>
				</div>

				<button type="submit">Kirish</button>

				{% if error %}
					<div class="error-box">{{ error }}</div>
				{% endif %}

				<p class="footer-text">
					Hisobingiz yo'qmi?<a href="{% url 'signup' %}">Ro'yxatdan o'tish</a>
				</p>
			</form>
		</div>
	</body>
</html>
